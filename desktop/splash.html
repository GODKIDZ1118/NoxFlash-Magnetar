<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoxFlash</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --ink: #0a0a0a;
        --ink-3: #737373;
        --ink-4: #a3a3a3;
        --track: rgba(0, 0, 0, 0.07);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0a0a0a;
            --ink: #fafafa;
            --ink-3: #8a8a8a;
            --ink-4: #525252;
            --track: rgba(255, 255, 255, 0.08);
        }
    }

    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        font-family: "Geist", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, system-ui, sans-serif;
    }

    .splash {
        position: absolute;
        inset: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
    }

    .lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 26px;
    }

    .logo {
        min-width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        color: var(--ink);
        opacity: 0.85;
        animation: breathe 2.4s ease-in-out infinite;
    }

    .logo img.mark {
        display: block;
        height: 34px;
        width: auto;
    }

    .logo img.mark-dark { display: none; }

    @media (prefers-color-scheme: dark) {
        .logo img.mark-light { display: none; }
        .logo img.mark-dark { display: block; }
    }

    .wordmark {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1;
        color: var(--ink);
    }

    .stage {
        font-size: 12.5px;
        color: var(--ink-3);
        min-height: 18px;
        letter-spacing: 0.02em;
        transition: color 0.3s ease;
    }

    .progress {
        width: 208px;
        height: 4px;
        margin-top: 12px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
    }

    .progress > i {
        display: block;
        width: 6%;
        height: 100%;
        border-radius: 999px;
        background: var(--ink);
        transition: width 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .hint {
        margin-top: 16px;
        font-size: 11px;
        color: var(--ink-4);
        letter-spacing: 0.02em;
    }

    @keyframes breathe {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
        .logo { animation: none; opacity: 1; }
    }
</style>
</head>

    <div class="stage" id="stage">正在启动</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="hint" id="hint">作品与设置都保存在本地</div>
</div>
<script>
    (function () {
        var stageEl = document.getElementById('stage');
        var barEl = document.getElementById('bar');
        var hintEl = document.getElementById('hint');
        var current = 6;
        var timer = null;

        function setStage(text, percent) {
            var label = String(text || '').trim();
            if (label) stageEl.textContent = label;
            var value = Number(percent);
            if (!isFinite(value)) return;
            value = Math.max(0, Math.min(100, value));
            if (value < current) value = current;
            current = value;
            barEl.style.width = value + '%';
        }

        // 没收到真实进度时也慢慢往前爬，别让用户以为卡死。
        function creep() {
            if (current >= 92) return;
            current = Math.min(92, current + 4);
            barEl.style.width = current + '%';
        }

        window.__noxflashSplash = {
            setStage: setStage,
            setHint: function (text) {
                var label = String(text || '').trim();
                if (label) hintEl.textContent = label;
            }
        };

        timer = setInterval(creep, 900);
        window.addEventListener('beforeunload', function () {
            if (timer) clearInterval(timer);
        });
    })();
</script>
